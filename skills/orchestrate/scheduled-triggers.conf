# Not active: a dispatched run is NOT the scheduled run, so firing it would be wrong (found while implementing #769).
#  - deploy-staging.yml: `schedule` runs only the staging-red-alert job; `workflow_dispatch` (suite=smoke default) deploys staging
#    and runs the smoke e2e suite.
#  - sentry-intake.yml: a dispatch defaults to dry_run=true (does nothing); dry_run=false would bypass the
#    `vars.SENTRY_INTAKE_ENABLED` kill switch and skip the schedule-only failure alert.
# Both need an app-repo change first (a dispatch input meaning "scheduled tick" that selects the schedule behaviour).
# Benjis-Plants/benjis-ops-tool deploy-staging.yml 15
# Benjis-Plants/benjis-ops-tool sentry-intake.yml 15

