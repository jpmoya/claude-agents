# Schedule-only GitHub workflows fired from the supervisor tick (#769; scheduled-triggers.sh). One per line:
#   <owner/repo> <workflow file> <interval minutes> [<input>=<value> ...] [ref=<branch>]
# The GitHub `schedule:` triggers stay in the app repos as a fallback; the script skips a workflow that is running or ran within
# one interval, so double firing is harmless. A workflow needs `workflow_dispatch:`; its inputs must make a dispatched run do what
# its scheduled run does (check `github.event_name == 'schedule'` branches before adding a line). Intervals are each file's cron.

# Release router (the workflow whose silence the status page alerts on, status-page/src/alerts.js)
Benjis-Plants/benjis-ops-tool auto-release.yml 5

