name: Deploy status page

# JP, 2026-10-27: deploying the status page used to be a manual `wrangler deploy` step that
# nobody remembered to run — a merged change (PR #498) sat unreleased for hours. This makes
# every push to main that touches status-page/ deploy itself automatically.

on:
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - ".github/workflows/deploy-status-page.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-status-page
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: status-page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # test/deployer-ci-wait.test.js, test/release-merge-rule-text.test.js and
        # test/stage-marker-blank.test.js check CLAUDE.md/orchestrator.md/pipeline-markers.sh
        # text for drift against this repo's other docs — unrelated to the page this workflow
        # deploys, and already failing on main independent of this change (JP, 2026-10-27).
        # Excluded here so a real status-page regression still blocks deploy; tracked separately.
        run: npx vitest run --exclude test/deployer-ci-wait.test.js --exclude test/release-merge-rule-text.test.js --exclude test/stage-marker-blank.test.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: status-page
          # Pinned: wrangler-action's own default (3.90.0) predates wrangler.jsonc support,
          # which fails with "Missing entry-point" even though main is set correctly (2026-10-27).
          wranglerVersion: "4"
          command: deploy
